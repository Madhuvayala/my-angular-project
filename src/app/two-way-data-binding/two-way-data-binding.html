<input type="text" placeholder="Enter your Name" [value]="name()" (input)="name.set($event.target.value)">

<p>{{name()}}</p>
<input type="text" [value]="user().name" (input)="updateName($event.target.value)">
<br>
<p>updatedName:{{user().name}}</p>
<hr>
<p>updatedAge:{{user().age}}</p>
<button (click)="updateAge()">Update Age</button>
